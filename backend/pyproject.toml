[project]
name = "ready-redis-backend"
version = "0.1.0"
description = "Backend for Ready Redis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic==1.13.1",
    "bcrypt==3.2.0",
    "celery==5.3.6",
    "fastapi==0.110.0",
    "flower==2.0.1",
    "httpx==0.27.0",
    "passlib[bcrypt]==1.7.4",
    "psycopg2-binary==2.9.9",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "redis==5.0.3",
    "sqlalchemy==2.0.29",
    "uvicorn[standard]==0.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx==0.27.0",
    "pytest==8.1.1",
    "pytest-asyncio==0.23.6",
    "pytest-mock==3.14.0",
]
